asyncapi: "3.0.0"
info:
  title: Smart VMS - visit.credential_grant.command (US-01, ADR-003)
  version: "1"
  description: >
    Cloud-recorded credential-grant INTENT, written by the Visitor & Visits
    domain inside the same transaction as the Registered->CheckedIn
    (checkin_verified) transition. There is no consumer yet -- the edge
    connector (apps/edge-connector) is still a README scaffold -- exactly
    the treatment ADR-002 gave visit.checkin_code.dispatch before any relay
    worker existed. A future edge-connector story consumes this queue and
    executes the actual badge/credential grant, reporting command state
    back to the cloud (per .claude/rules/edge-dotnet.md); this contract
    only covers the cloud-side intent.

    Envelope-encrypted uniformly with every other outbox_messages row
    (ADR-002 §5), even though this payload carries no visitor PII -- see
    ADR-003 for why a plaintext special case was rejected.

    No `zone` field: `.claude/rules/contracts.md` defines the device-
    command envelope as tenant/site/device/correlation-id/expiry/
    idempotency-key. `site_id`/`device_id` are both null (no sites/zones
    schema exists yet) -- see ADR-003 for why zone-scoping stays out of
    this envelope rather than being represented by a placeholder string.

    `expiry` reuses `checkin_code_expires_at` (the deadline to arrive and
    use the code) as a KNOWN-WRONG placeholder for the credential's actual
    validity window -- ADR-003 records this as an open question, not
    settled design.
channels:
  visit.credential_grant.command:
    address: visit.credential_grant.command
    messages:
      VisitCredentialGrantCommand:
        $ref: "#/components/messages/VisitCredentialGrantCommand"
operations:
  publishVisitCredentialGrantCommand:
    action: send
    channel:
      $ref: "#/channels/visit.credential_grant.command"
    summary: >
      Published by the Visitor & Visits domain when a visit transitions
      Registered -> CheckedIn (checkin_verified). idempotency_key is
      deterministic: sha256("visit.credential_grant.command:" + visit_id)
      -- a visit can be checked in exactly once, so exactly one grant
      command exists per visit.
components:
  messages:
    VisitCredentialGrantCommand:
      name: VisitCredentialGrantCommand
      contentType: application/json
      payload:
        type: object
        required:
          - schema_version
          - tenant_id
          - visit_id
          - correlation_id
          - idempotency_key
          - expiry
          - site_id
          - device_id
        properties:
          schema_version:
            type: string
            const: "1"
          tenant_id: { type: string, format: uuid }
          visit_id: { type: string, format: uuid }
          correlation_id: { type: string, format: uuid }
          idempotency_key:
            type: string
            description: >
              Deterministic -- sha256("visit.credential_grant.command:" + visit_id).
          expiry:
            type: string
            format: date-time
            description: >
              KNOWN-WRONG PLACEHOLDER (ADR-003 open question): reuses
              visits.checkin_code_expires_at (the arrival deadline), not a
              real visit-duration/credential-validity policy -- no such
              field exists yet. A future edge connector enforcing this
              panel-side would revoke access at the arrival deadline, not
              at the end of the visit.
          site_id:
            type: [string, "null"]
            format: uuid
            description: Reserved, always null in this story -- no sites/zones schema exists yet.
          device_id:
            type: [string, "null"]
            format: uuid
            description: Reserved, always null in this story.
x-security-posture:
  description: >
    No PII in this payload -- opaque IDs and a time window only. Envelope-
    encrypted anyway (ADR-002 §5's uniform invariant), never a plaintext
    special case.
